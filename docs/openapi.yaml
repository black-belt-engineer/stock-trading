openapi: 3.1.0
info:
  title: Stock Trading Platform API
  version: 2.0.0
  description: |
    HTTP API of the platform. A browser talks to one origin, the backend-for-frontend (BFF), which
    keeps the Keycloak tokens and forwards data requests to the services in `apps/`:

    | Service       | Port | Paths                                                        |
    |---------------|------|--------------------------------------------------------------|
    | bff           | 3005 | `/bff/*`, and `/quotes/*` and `/stream` forwarded to sse-service |
    |               |      | and `/portfolio/*` forwarded to portfolio                    |
    | sse-service   | 3003 | `/quotes/*`, `/stream` (behind the BFF)                      |
    | portfolio     | 3006 | `/portfolio/*` (behind the BFF)                              |
    | consumer      | 3002 | health only                                                  |
    | ingestor      | 3001 | health only                                                  |

    Keycloak (port 8180, realm `stock-platform`) owns accounts, login, registration and Google
    sign-in. Its pages are not described here; the BFF sends the browser to them from `/bff/login`.

    Every service also exposes `/health`, `/health/live` and `/health/ready`.

    **Authentication.** The browser never sees a token. `/bff/login` starts the Keycloak login, and
    `/bff/callback` stores the tokens in a Redis session and sets the `session` cookie (`HttpOnly`,
    `SameSite=Strict`, holding only a session id). For `/quotes/*`, `/stream` and `/portfolio/*` the BFF refreshes
    the access token when it is within 30 seconds of expiry, then forwards the request with
    `Authorization: Bearer <access token>`. The cookie and any `Authorization` header the browser
    sent are dropped. The services still verify the token themselves, against Keycloak's keys.
    Calling a service directly (the other servers below) needs that bearer token, which only the
    BFF holds: use the BFF server.

    **CSRF.** Every request that is not a read (`GET`, `HEAD`, `OPTIONS`) to the BFF needs
    `X-Requested-With: fetch`, or it is a `403 CSRF_REJECTED`. The exception is
    `/bff/backchannel-logout`, which Keycloak calls with a signed token instead.

    **Errors.** Every error body from the BFF and the services is `{ "error": "<message>", "code": "<CODE>" }`.
    A missing or expired session is `401 UNAUTHENTICATED` on every path behind the BFF.

    **Servers.** The first server is the docs server started by `pnpm docs:api`: it proxies
    each path to the BFF (or the service, for health) the same way the Vite dev proxy does, so
    "Try it out" works without CORS. Log in to the app (`http://localhost:5173`) in the same browser first:
    the login redirects back to the app's own origin, and cookies are not separated by port, so the
    `session` cookie it sets reaches the docs server too.
servers:
  - url: /
    description: Docs server proxy (pnpm docs:api)
  - url: http://localhost:3005
    description: bff
  - url: http://localhost:3003
    description: sse-service (needs a bearer token; use the BFF instead)
  - url: http://localhost:3006
    description: portfolio (needs a bearer token; use the BFF instead)
  - url: http://localhost:3002
    description: consumer
  - url: http://localhost:3001
    description: ingestor

tags:
  - name: Session
    description: Login, session check and logout (BFF). Keycloak does the actual authentication.
  - name: Quotes
    description: Latest quotes, tick history and candles (sse-service, through the BFF). All need a session.
  - name: Stream
    description: Server-sent price events (sse-service, through the BFF).
  - name: Watchlist
    description: The user's starred symbols (portfolio service, through the BFF). The user is always the session's; no path takes a user id.
  - name: Health
    description: Probes, present on every service.

paths:
  /bff/login:
    get:
      tags: [Session]
      operationId: bffLogin
      summary: Start a login (redirects to Keycloak)
      description: |
        Sets the signed `login` cookie (`HttpOnly`, `SameSite=Lax`, `Path=/bff/callback`, 10 minutes)
        and redirects to Keycloak's authorisation endpoint with a fresh `state`, `nonce` and PKCE
        challenge. Browsers only: the reply is a redirect to a login page.

        `returnTo` must be a same-origin path; anything else (another host, `//host`, `/bff/*`)
        silently becomes `/`. The other parameters are allow-lists, and any other value is a
        `400 VALIDATION_ERROR`.
      parameters:
        - name: returnTo
          in: query
          description: Where to land after login. A same-origin path, `/` when missing or not accepted.
          schema:
            type: string
          example: /history/AAPL
        - name: prompt
          in: query
          description: "`create` opens Keycloak's registration page."
          schema:
            type: string
            enum: [create]
        - name: idp
          in: query
          description: "`google` skips Keycloak's login page and goes to Google (`kc_idp_hint`)."
          schema:
            type: string
            enum: [google]
        - name: action
          in: query
          description: A Keycloak application-initiated action, sent as `kc_action`. The Settings page uses these.
          schema:
            type: string
            enum: [UPDATE_PROFILE, UPDATE_PASSWORD, delete_account]
      responses:
        "302":
          description: Redirect to Keycloak.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: "`login=<signed state>; Path=/bff/callback; HttpOnly; SameSite=Lax` (and `Secure` in production)."
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ValidationError"

  /bff/callback:
    get:
      tags: [Session]
      operationId: bffCallback
      summary: Finish a login (Keycloak redirects here)
      description: |
        Not called by clients. Checks the `login` cookie and `state`, exchanges the code (with the
        PKCE verifier and `nonce`) for tokens, keeps them in a new Redis session, sets the `session`
        cookie and redirects to the `returnTo` chosen at `/bff/login`. The `login` cookie is single
        use and is cleared on every answer. After an account action the stored name and email follow
        the new ID token.

        If Keycloak sends `error` (the user cancelled an action, for example) the redirect goes to
        `returnTo` and the session is left as it was.
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to `returnTo`.
          headers:
            Set-Cookie:
              description: "`session=<id>; Path=/; HttpOnly; SameSite=Strict` (`__Host-session` and `Secure` in production). The value is a random session id, never a token."
              schema:
                type: string
        "400":
          description: "`LOGIN_EXPIRED` (no valid `login` cookie), `STATE_MISMATCH`, or `LOGIN_REJECTED` (Keycloak refused the code, for example a replayed one)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /bff/me:
    get:
      tags: [Session]
      operationId: bffMe
      summary: The signed-in user
      description: |
        The frontend's startup check. A session whose access token is about to expire is refreshed
        first. No token is ever in the body.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /bff/logout:
    post:
      tags: [Session]
      operationId: bffLogout
      summary: Log out
      description: |
        Deletes the session, clears the cookie and revokes the refresh token (best effort: a
        Keycloak failure is only logged). The page must then navigate to `endSessionUrl` so
        Keycloak ends its own session too. `endSessionUrl` is `null` when there was no session to
        read; go to `/` then. Needs no Keycloak connection.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /bff/backchannel-logout:
    post:
      tags: [Session]
      operationId: bffBackchannelLogout
      summary: Keycloak's back-channel logout (server to server)
      description: |
        Called by Keycloak when a session ends elsewhere (admin console, password change). Not for
        browsers: it needs no cookie and no `X-Requested-With`, because the signed logout token is the
        proof. The token's signature (Keycloak's RS256 key), `iss`, `aud` (`stock-bff`), `iat`,
        `jti` and `events` claim are checked, and it must not have a `nonce`. A `sid` deletes that
        one session; a `sub` alone deletes every session of the user. Deleting nothing is still `200`.
        Reachable only on the compose network side of Keycloak; the realm's client has the URL.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              properties:
                logout_token:
                  type: string
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The token is missing or not valid (`INVALID_LOGOUT_TOKEN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /quotes/discovery/active-stocks:
    get:
      tags: [Quotes]
      operationId: getActiveStocks
      summary: Every registered symbol with its latest quote and sparkline
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The discovery list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveStocksResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /quotes/{symbol}/snapshot:
    get:
      tags: [Quotes]
      operationId: getSnapshot
      summary: Latest quote of one symbol
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: The latest quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestPrice"
        "400":
          $ref: "#/components/responses/InvalidSymbol"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown symbol, or no quote received for it yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /quotes/{symbol}/ticks:
    get:
      tags: [Quotes]
      operationId: getTicks
      summary: A page of stored ticks, newest first
      description: |
        `from` defaults to 15 minutes before `to`, `to` defaults to now and is clamped to now.
        The range may not exceed 24 hours. Page on with `nextCursor` and the same `from` and `to`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page. Opaque.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "200":
          description: One page of ticks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicksPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownSymbol"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /quotes/{symbol}/ticks.csv:
    get:
      tags: [Quotes]
      operationId: exportTicksCsv
      summary: Download stored ticks as CSV
      description: |
        Same range rules as `/quotes/{symbol}/ticks`. At most 100,000 rows; a larger range is a 400.
        Columns: `time,symbol,price,size,side`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: The CSV file, streamed.
          headers:
            Content-Disposition:
              description: '`attachment; filename="<SYMBOL>_<from>_<to>.csv"`, times in ISO-8601 basic format.'
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
              example: |
                time,symbol,price,size,side
                2026-11-12T10:30:00.123Z,AAPL,228.51,120,buy
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownSymbol"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /quotes/{symbol}/candles:
    get:
      tags: [Quotes]
      operationId: getCandles
      summary: OHLCV candles aggregated from stored ticks
      description: |
        Without `from` the window is the latest 120 bars. At most 500 bars per request. `to` is
        exclusive and clamped to now. A `1d` bar is one market session of the symbol's exchange.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - name: interval
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CandleInterval"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: fill
          in: query
          description: "`previous`: an empty bucket is a flat bar at the previous close. `gaps`: it is left out."
          schema:
            $ref: "#/components/schemas/CandleFill"
      responses:
        "200":
          description: The candles, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandlesResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownSymbol"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /stream:
    get:
      tags: [Stream]
      operationId: streamPrices
      summary: Live price events (Server-Sent Events)
      description: |
        Opens a `text/event-stream`. Through the BFF the stream is not buffered and has no idle
        timeout. Events:

        - `snapshot`: one per requested symbol that has a quote, sent first. Data: `StreamQuote`.
          Current state, not a trade.
        - `price`: one per trade. Data: `StreamQuote`.
        - `session-expired`: sent when the access token expires, then the stream closes. Empty data.
          Reconnect: the BFF refreshes the token on the new request.

        The symbol list and the token are checked before any SSE header is sent, so a rejected
        request gets a normal JSON error.
      security:
        - sessionCookie: []
      parameters:
        - name: symbols
          in: query
          description: Comma-separated symbols. Missing or empty means every registered symbol. Duplicates are dropped.
          schema:
            type: string
          example: AAPL,MSFT,BRK.B
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: snapshot
                data: {"symbol":"AAPL","name":"Apple Inc.","sessionId":"2026-11-16","price":228.5, ...}

                event: price
                data: {"symbol":"AAPL","name":"Apple Inc.","sessionId":"2026-11-16","price":228.52, ...}

                event: session-expired
                data:
        "400":
          $ref: "#/components/responses/InvalidSymbol"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnknownSymbol"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /portfolio/watchlist:
    get:
      tags: [Watchlist]
      operationId: getWatchlist
      summary: The user's watchlist, in their order
      description: |
        Symbols that have left the registry stay on the list with `listed: false`, so the user can
        remove them; the app does not show them in the grid.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The watchlist, possibly empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /portfolio/watchlist/order:
    put:
      tags: [Watchlist]
      operationId: reorderWatchlist
      summary: Set the order of the watchlist
      description: |
        Send the whole list in the new order. Watched symbols the request leaves out (added on
        another device meanwhile) keep their relative order after the named ones. A symbol that is
        not on the list, or named twice, is a `400`. Two devices reordering at once: the last write wins.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XRequestedWith"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [symbols]
              properties:
                symbols:
                  type: array
                  maxItems: 100
                  items:
                    type: string
            example: { symbols: [TSLA, AAPL, KO] }
      responses:
        "204":
          description: Reordered.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /portfolio/watchlist/{symbol}:
    put:
      tags: [Watchlist]
      operationId: addToWatchlist
      summary: Star a symbol (idempotent)
      description: Adds the symbol at the end of the list. A symbol already on it changes nothing. At most 100 symbols.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/XRequestedWith"
      responses:
        "204":
          description: On the watchlist.
        "400":
          $ref: "#/components/responses/InvalidSymbol"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          $ref: "#/components/responses/UnknownSymbol"
        "409":
          description: The watchlist already has 100 symbols (`CONFLICT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [Watchlist]
      operationId: removeFromWatchlist
      summary: Unstar a symbol (idempotent)
      description: Any well-formed symbol is accepted, also one no longer in the registry. Not on the list is not an error.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/XRequestedWith"
      responses:
        "204":
          description: Not on the watchlist (any more).
        "400":
          $ref: "#/components/responses/InvalidSymbol"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Service status
      description: The body depends on the service; see the `oneOf` variants.
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BasicHealth"
                  - $ref: "#/components/schemas/ConsumerHealth"
                  - $ref: "#/components/schemas/IngestorHealth"
                  - $ref: "#/components/schemas/SseHealth"

  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Liveness probe
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"

  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness probe
      description: "Checks the service's dependencies: Redis (bff, sse-service), Postgres and Redis (consumer), none (ingestor)."
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: A dependency is down.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: |
        The BFF's session cookie (`__Host-session` in production), set by `/bff/callback`. It holds
        a random session id; the tokens stay in Redis. Browsers send it on their own. In "Try it out"
        log in to the app in the same browser first. The BFF adds the bearer token itself when
        it forwards to a service.

  parameters:
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: Must be `fetch`. A cross-site form cannot set it.
      schema:
        type: string
        enum: [fetch]
    Symbol:
      name: symbol
      in: path
      required: true
      description: A registered ticker. Lower case is accepted.
      schema:
        type: string
        minLength: 1
        maxLength: 32
      example: AAPL
    From:
      name: from
      in: query
      description: ISO-8601 date-time with a time zone, inclusive.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: ISO-8601 date-time with a time zone, exclusive. Clamped to now.
      schema:
        type: string
        format: date-time

  responses:
    ValidationError:
      description: The request is malformed (`VALIDATION_ERROR`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: "body/email must match format \"email\"", code: VALIDATION_ERROR }
    InvalidSymbol:
      description: Malformed symbol (`VALIDATION_ERROR`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnknownSymbol:
      description: The symbol is not in the registry (`NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No session cookie, or the session is unknown, expired or refused by Keycloak (`UNAUTHENTICATED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CsrfRejected:
      description: "`X-Requested-With: fetch` is missing on a request that is not a read (`CSRF_REJECTED`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: The service behind the BFF could not be reached (`UPSTREAM_UNAVAILABLE`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: The session store, or Keycloak when a token must be refreshed, is down (`SERVICE_UNAVAILABLE`). A token that has not expired yet keeps working while Keycloak is down.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    WatchlistItem:
      type: object
      required: [symbol, addedAt, listed]
      properties:
        symbol:
          type: string
          example: AAPL
        addedAt:
          type: string
          format: date-time
          description: When the symbol was starred.
        listed:
          type: boolean
          description: False once the symbol has left the registry.
    WatchlistResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistItem"
    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable message.
        code:
          type: string
          description: Machine-readable code.
          examples:
            - VALIDATION_ERROR
            - UNAUTHENTICATED
            - CSRF_REJECTED
            - LOGIN_EXPIRED
            - STATE_MISMATCH
            - LOGIN_REJECTED
            - INVALID_LOGOUT_TOKEN
            - UPSTREAM_UNAVAILABLE
            - SERVICE_UNAVAILABLE
            - UNAUTHORIZED
            - NOT_FOUND
            - JWKS_UNAVAILABLE
            - INTERNAL_ERROR

    Me:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [id, name, email]
          properties:
            id:
              type: string
              format: uuid
              description: The Keycloak user id (`sub`).
            name:
              type: string
            email:
              type: string
              format: email

    LogoutResponse:
      type: object
      required: [endSessionUrl]
      properties:
        endSessionUrl:
          type: [string, "null"]
          description: Keycloak's end-session URL (with `id_token_hint` and the post-logout redirect). Navigate there. `null` when there was no session.

    Sector:
      type: string
      enum:
        - Communication Services
        - Consumer Discretionary
        - Consumer Staples
        - Energy
        - Financials
        - Health Care
        - Technology

    Exchange:
      type: string
      enum: [NASDAQ, NYSE]

    TickDirection:
      type: string
      enum: [up, down, flat]
      description: How the last tick moved the price against the tick before it.

    TradeSide:
      type: string
      enum: [buy, sell]

    ActiveStock:
      type: object
      description: |
        A registered symbol with no ticks yet has `null` prices and `lastUpdated`, never zeros.
        Day values belong to `sessionId`; `change` and `changePercent` are against `previousClose`.
      required:
        - symbol
        - name
        - sector
        - exchange
        - sessionId
        - currentPrice
        - previousClose
        - open
        - high
        - low
        - volume
        - change
        - changePercent
        - tickDirection
        - lastUpdated
        - sparkline
      properties:
        symbol:
          type: string
        name:
          type: string
        sector:
          $ref: "#/components/schemas/Sector"
        exchange:
          $ref: "#/components/schemas/Exchange"
        sessionId:
          type: [string, "null"]
        currentPrice:
          type: [number, "null"]
        previousClose:
          type: [number, "null"]
        open:
          type: [number, "null"]
        high:
          type: [number, "null"]
        low:
          type: [number, "null"]
        volume:
          type: [number, "null"]
        change:
          type: [number, "null"]
        changePercent:
          type: [number, "null"]
        tickDirection:
          oneOf:
            - $ref: "#/components/schemas/TickDirection"
            - type: "null"
        lastUpdated:
          type: [number, "null"]
          description: Epoch milliseconds.
        sparkline:
          type: array
          items:
            type: number

    ActiveStocksResponse:
      type: object
      required: [listName, stocks]
      properties:
        listName:
          type: string
          const: active-stocks
        stocks:
          type: array
          items:
            $ref: "#/components/schemas/ActiveStock"

    LatestPrice:
      type: object
      description: The latest quote with the values of the current session. `change` and `changePercent` are against `previousClose`.
      required:
        - symbol
        - name
        - sessionId
        - currentPrice
        - previousClose
        - open
        - high
        - low
        - volume
        - change
        - changePercent
        - tickDirection
        - lastSize
        - lastSide
        - lastUpdated
      properties:
        symbol:
          type: string
        name:
          type: string
        sessionId:
          type: string
        currentPrice:
          type: number
        previousClose:
          type: number
        open:
          type: number
        high:
          type: number
        low:
          type: number
        volume:
          type: number
        change:
          type: number
        changePercent:
          type: number
        tickDirection:
          $ref: "#/components/schemas/TickDirection"
        lastSize:
          type: number
          description: Size of the last trade, in shares.
        lastSide:
          $ref: "#/components/schemas/TradeSide"
        lastUpdated:
          type: number
          description: Epoch milliseconds.

    StreamQuote:
      type: object
      description: |
        Data of the `snapshot` and `price` SSE events: the day values of the symbol's current session
        plus the trade that produced them. A new `sessionId` replaces the client's day values.
      required:
        - symbol
        - name
        - sessionId
        - price
        - previousClose
        - open
        - high
        - low
        - volume
        - change
        - changePercent
        - tickDirection
        - quantity
        - side
        - timestamp
      properties:
        symbol:
          type: string
        name:
          type: string
        sessionId:
          type: string
        price:
          type: number
        previousClose:
          type: number
        open:
          type: number
        high:
          type: number
        low:
          type: number
        volume:
          type: number
        change:
          type: number
        changePercent:
          type: number
        tickDirection:
          $ref: "#/components/schemas/TickDirection"
        quantity:
          type: number
          description: Size of the trade, in shares.
        side:
          $ref: "#/components/schemas/TradeSide"
        timestamp:
          type: number
          description: Epoch milliseconds.

    Tick:
      type: object
      description: One stored trade. A column is `null` only in rows older than the current schema.
      required: [id, time, price, size, side]
      properties:
        id:
          type: string
          description: Unique per row; stable across pages.
        time:
          type: string
          description: ISO-8601 UTC, millisecond precision.
        price:
          type: [number, "null"]
        size:
          type: [number, "null"]
        side:
          oneOf:
            - $ref: "#/components/schemas/TradeSide"
            - type: "null"

    TicksPage:
      type: object
      required: [symbol, from, to, ticks, nextCursor]
      properties:
        symbol:
          type: string
        from:
          type: string
          description: The range actually queried (defaults applied). Page on with the same values.
        to:
          type: string
          description: The range end actually queried (clamped to now).
        ticks:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/Tick"
        nextCursor:
          type: [string, "null"]
          description: Pass as `cursor` for the next (older) page; `null` on the last page.

    CandleInterval:
      type: string
      enum: ["1m", "5m", "1h", "1d"]
      description: "`1d` is one market session."

    CandleFill:
      type: string
      enum: [previous, gaps]
      default: previous

    OhlcvBar:
      type: object
      required: [symbol, timestamp, end, open, high, low, close, volume, interval, complete]
      properties:
        symbol:
          type: string
        timestamp:
          type: number
          description: Bucket start, epoch ms, inclusive.
        end:
          type: number
          description: Bucket end, epoch ms, exclusive.
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
          description: Shares traded in the bucket.
        interval:
          $ref: "#/components/schemas/CandleInterval"
        complete:
          type: boolean
          description: "`false` while the bucket is still open."

    CandlesResponse:
      type: object
      required: [symbol, interval, fill, from, to, bars, lastTradeAt]
      properties:
        symbol:
          type: string
        interval:
          $ref: "#/components/schemas/CandleInterval"
        fill:
          $ref: "#/components/schemas/CandleFill"
        from:
          type: string
          description: Start of the first bucket in the window.
        to:
          type: string
          description: End (exclusive) of the last bucket in the window.
        bars:
          type: array
          description: Oldest first. The last bar has `complete false` while its bucket is open.
          items:
            $ref: "#/components/schemas/OhlcvBar"
        lastTradeAt:
          type: [string, "null"]
          description: ISO time of the newest trade the bars include. Apply only newer streamed trades to the last bar.

    LivenessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          properties:
            db:
              type: boolean
            redis:
              type: boolean

    BasicHealth:
      title: bff
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    ConsumerHealth:
      title: consumer
      type: object
      required: [status, messagesProcessed, lastMessageAt]
      properties:
        status:
          type: string
          enum: [starting, healthy]
        messagesProcessed:
          type: integer
        lastMessageAt:
          type: [number, "null"]
          description: Epoch milliseconds.

    IngestorHealth:
      title: ingestor
      type: object
      required: [status, tickCount]
      properties:
        status:
          type: string
          const: ok
        tickCount:
          type: integer

    SseHealth:
      title: sse-service
      type: object
      required: [status, activeConnections]
      properties:
        status:
          type: string
          const: ok
        activeConnections:
          type: integer
