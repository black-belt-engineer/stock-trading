name: stock-trading

# Local development stack.
# Optional: copy .env.local.example → .env.local for overrides and so app env matches containers.
# Compose interpolates ${...} from a `.env` file in this directory or `docker compose --env-file ...`.

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: stock-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - path: .env.local
        required: false
    environment:
      POSTGRES_DB: stockdb
      POSTGRES_USER: stockuser
      POSTGRES_PASSWORD: stockpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stock-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockuser -d stockdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: stock-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    env_file:
      - path: .env.local
        required: false
    networks:
      - stock-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Kafka-compatible broker (Redpanda) for local market-data streaming.
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.11
    container_name: stock-redpanda
    restart: unless-stopped
    ports:
      - "9092:9092"
    env_file:
      - path: .env.local
        required: false
    command:
      - redpanda
      - start
      # Two listeners: apps on the host use localhost:9092; containers on stock-net (Keycloak's
      # event listener, K6) use kafka:29092. A client gets the advertised address of the
      # listener it came in on, and localhost would point a container at itself.
      - --kafka-addr
      - external://0.0.0.0:9092,internal://0.0.0.0:29092
      - --advertise-kafka-addr
      - external://localhost:9092,internal://kafka:29092
      - --mode
      - dev-container
      - --smp
      - "1"
    networks:
      - stock-net

  # Identity provider (roadmap/08-identity.md, K1). Dev mode only: production needs `start`
  # with an optimised build and TLS behind the reverse proxy (README Q9).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: stock-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      # K6: the stock-kafka event listener publishes account deletions to this topic.
      - --spi-events-listener--stock-kafka--bootstrap-servers=kafka:29092
      - --spi-events-listener--stock-kafka--topic=identity.events
    ports:
      - "8180:8080"
    env_file:
      - path: .env.local
        required: false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      # Read by the realm import as ${KC_BFF_CLIENT_SECRET}; scripts/dev.sh generates it.
      KC_BFF_CLIENT_SECRET: ${KC_BFF_CLIENT_SECRET:-}
      # Read by the realm import as ${KC_PORTFOLIO_CLIENT_SECRET}: the cleanup's service account (K6).
      KC_PORTFOLIO_CLIENT_SECRET: ${KC_PORTFOLIO_CLIENT_SECRET:-}
      # Read by the realm import as ${GOOGLE_CLIENT_ID} / ${GOOGLE_CLIENT_SECRET}. Optional:
      # without them the Google provider stays disabled (scripts/dev.sh decides).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Own database in the shared Postgres container; never stockdb. scripts/dev.sh creates it.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: stockuser
      KC_DB_PASSWORD: stockpass
      # Public URL: the issuer and every redirect point at the app's origin (Vite proxy),
      # however Keycloak is reached.
      KC_HOSTNAME: http://localhost:5173
      # Back-channel URLs (token, certs) follow the request, so the BFF and the services
      # can call http://localhost:8180 directly while the issuer stays the public URL.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # The Vite proxy only forwards /realms and /resources, so the admin console stays on 8180.
      KC_HOSTNAME_ADMIN: http://localhost:8180
      # Health endpoints on the management port 9000 (not published; used by the healthcheck).
      KC_HEALTH_ENABLED: "true"
      # Only here to recreate the container when a provider JAR changes (scripts/dev.sh sets it).
      PROVIDERS_SHA: ${PROVIDERS_SHA:-}
    volumes:
      # Realm as code; imported only when the realm does not exist (scripts/dev.sh --reset-realm).
      - ./infra/keycloak:/opt/keycloak/data/import:ro
      # The provider JARs, copied here by scripts/dev.sh: the login theme (`pnpm
      # build-keycloak-theme`) and the stock-kafka event listener (infra/keycloak/event-listener).
      # The folder is mounted, not the files, so a missing build does not make Docker create
      # directories in their place.
      - ./infra/keycloak/providers:/opt/keycloak/providers:ro
    extra_hosts:
      # Lets Keycloak reach the BFF on the host for back-channel logout (Linux needs this entry).
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - stock-net
    healthcheck:
      test: >
        exec 3<>/dev/tcp/127.0.0.1/9000 &&
        printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
        grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  stock-net:
    name: stock-net
    driver: bridge

volumes:
  postgres_data:
    name: stock-postgres-data
